<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example style frame</title>
  <style>
    :root {
      --sf-bg: #1b2a41;
      --sf-surface: #324a5f;
      --sf-frame: #0c1821;
      --sf-accent: #f2c14e;
      --sf-hero: #f78154;
      --sf-friend: #5fad56;
      --sf-text: #ccc9dc;
    }
    body { margin: 0; background: var(--sf-bg); color: var(--sf-text); font-family: monospace; display: grid; place-items: center; min-height: 100vh; }
    .sf-device { background: var(--sf-frame); padding: 1.5rem; border-radius: 1.5rem; border: 4px solid var(--sf-surface); }
    .sf-screen { width: 22rem; max-width: 80vw; aspect-ratio: 10 / 9; background: var(--sf-surface); position: relative; border: 4px solid var(--sf-frame); }
    .sf-actor { position: absolute; width: 2rem; height: 2rem; border-radius: 0.4rem; }
    .sf-hero { background: var(--sf-hero); left: 30%; top: 45%; }
    .sf-friend { background: var(--sf-friend); left: 60%; top: 30%; }
    .sf-item { background: var(--sf-accent); left: 50%; top: 65%; width: 1rem; height: 1rem; }
    .sf-dialog { position: absolute; left: 0.5rem; right: 0.5rem; bottom: 0.5rem; background: var(--sf-frame); border: 3px solid var(--sf-accent); padding: 0.5rem; }
    h1 { margin: 0 0 1rem; font-size: 1rem; color: var(--sf-accent); text-align: center; }
    @media (prefers-reduced-motion: no-preference) { .sf-item { animation: sf-bob 1s steps(2) infinite; } }
    @keyframes sf-bob { 50% { transform: translateY(-4px); } }
  </style>
</head>
<body>
  <main class="sf-device">
    <h1>Example style frame</h1>
    <div class="sf-screen" role="img" aria-label="A hero, a friend and an item in a room">
      <div class="sf-actor sf-hero"></div>
      <div class="sf-actor sf-friend"></div>
      <div class="sf-actor sf-item"></div>
      <div class="sf-dialog">Copy this folder to docs/design/&lt;ticket&gt;/ and draw the real frame.</div>
    </div>
  </main>
</body>
</html>
