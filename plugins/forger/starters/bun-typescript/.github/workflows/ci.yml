name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # The branch checks diff against the merge-base with the base branch, so they need history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # Must equal `gates` in .forger/workloop.config.json.
      - name: Gates
        run: bun install --frozen-lockfile && bun run check && bun test --coverage --coverage-reporter=lcov
