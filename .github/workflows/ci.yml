name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # The branch checks diff against the merge-base with main, so they need history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # A real browser for the capture integration test; without it that test skips.
      - name: Playwright
        run: |
          mkdir "$RUNNER_TEMP/playwright" && cd "$RUNNER_TEMP/playwright"
          echo '{"private":true}' > package.json
          npm install playwright
          npx playwright install --with-deps chromium
          echo "FORGER_PLAYWRIGHT_ROOT=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"
      # Must equal `gates` in .forger/workloop.config.json; a test fails when they drift.
      - name: Gates
        run: cd plugins/forger/engine && bun install --frozen-lockfile && bun run check && cd ../../.. && bun plugins/forger/bin/work.ts check
      - name: Job summary
        if: always()
        run: bun plugins/forger/bin/work.ts check --summary >> "$GITHUB_STEP_SUMMARY" || true

  # Setup bugs fail here, not on a new repository. A fixture is a directory under
  # test/fixtures/projects/; the job needs no change to cover a new one.
  setup-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Assertions
        run: bun test test/fixtures/assertions.test.ts
      - name: Setup on each fixture
        run: bun test/fixtures/run.integration.ts

  # The samples under examples/sandbox are built and tested here and never pushed.
  sandbox-samples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample:
          - {name: devcontainer, dockerfile: examples/sandbox/devcontainer/.devcontainer/Dockerfile, context: examples/sandbox/devcontainer/.devcontainer}
          - {name: node, dockerfile: examples/sandbox/node/Dockerfile, context: examples/sandbox/node}
          - {name: python, dockerfile: examples/sandbox/python/Dockerfile, context: examples/sandbox/python}
          - {name: engine, dockerfile: examples/sandbox/engine/Dockerfile, context: examples/sandbox/engine}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build
        run: docker build -t "sample-${{ matrix.sample.name }}" -f "${{ matrix.sample.dockerfile }}" "${{ matrix.sample.context }}"
      - name: Check sandbox
        run: |
          work="$PWD/plugins/forger/bin/work.ts"
          proj="$RUNNER_TEMP/proj"
          mkdir -p "$proj/.forger" && cd "$proj"
          git init -q && git remote add origin https://github.com/example/example.git
          echo '{"features":{}}' > .forger/backlog.json
          echo '{"tracker":{"kind":"local"},"allow_unguarded":true,"harness":"claude","sandbox":"docker","sandbox_image":"sample-${{ matrix.sample.name }}"}' > .forger/workloop.config.json
          bun "$work" check sandbox
